services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: carpet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: carpet_db
      DB_USER: postgres
      DB_PASS: secretpassword
    depends_on:
      - db

volumes:
  pgdata:
